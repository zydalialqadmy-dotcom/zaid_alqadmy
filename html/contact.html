<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="h-main bg-primary text-white p-3">
        <div class="container">
            <nav class="n-main navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand b-main" href="index.html"><i class="fa fa-book"></i> Zaid Library</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="تبديل التنقل">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto nav-list-main">
                           <li class="nav-item"><a class="nav-link n-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link n-link" href="books.html">Books</a></li>
                        <li class="nav-item"><a class="nav-link n-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link n-link" href="services.html">Services</a></li>
                        <li class="nav-item"><a class="nav-link n-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <main class="m-main container mt-5">
        <section>
            <h2>Contact Us</h2>
            <p>You can contact us using the form below or through social media.</p>
            <form id="contactForm" class="mb-4" style="max-width:500px;">
                <div class="mb-3">
                    <label for="contactName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="contactName" required>
                </div>
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="contactEmail" required>
                </div>
                <div class="mb-3">
                    <label for="contactMsg" class="form-label">Your Message</label>
                    <textarea class="form-control" id="contactMsg" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
            <div id="contactResult"></div>
            <div class="mt-4">
                <h5>Follow us on social media:</h5>
                <a href="#" class="me-2"><i class="fab fa-facebook fa-2x text-primary"></i></a>
                <a href="#" class="me-2"><i class="fab fa-twitter fa-2x text-info"></i></a>
                <a href="#" class="me-2"><i class="fab fa-instagram fa-2x text-danger"></i></a>
                <a href="#" class="me-2"><i class="fab fa-whatsapp fa-2x text-success"></i></a>
            </div>
        </section>
    </main>
    <footer class="f-main bg-light text-center text-muted py-3 mt-5">
        &copy; 2025 Zaid Library. جميع الحقوق محفوظة.
    </footer>
    <!-- jQuery (required for Bootstrap 5 if using plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap Bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function() {
        $('#contactForm').submit(function(e) {
            e.preventDefault();
            let name = $('#contactName').val().trim();
            let email = $('#contactEmail').val().trim();
            let msg = $('#contactMsg').val().trim();
            let valid = true;
            let result = '';
            if (name.length < 3) {
                valid = false;
                result = '<div class="alert alert-danger">Please enter a valid name.</div>';
            } else if (!/^(([^<>()\[\]\\.,;:\s@\"]+(\.[^<>()\[\]\\.,;:\s@\"]+)*)|(".+"))@(([^<>()[\]\\.,;:\s@\"]+\.)+[^<>()[\]\\.,;:\s@\"]{2,})$/i.test(email)) {
                valid = false;
                result = '<div class="alert alert-danger">Please enter a valid email address.</div>';
            } else if (msg.length < 10) {
                valid = false;
                result = '<div class="alert alert-danger">The message must be at least 10 characters.</div>';
            }
            if (valid) {
                result = '<div class="alert alert-success">Your message has been sent successfully! We will reply to you soon.</div>';
                $('#contactForm')[0].reset();
            }
            $('#contactResult').html(result);
        });
    });
    </script>
</body>
</html>
